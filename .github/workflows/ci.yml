name: CI
on:
  pull_request:
  merge_group:
jobs:
  validate:
    name: Full validation
    # Only the queue runs this job; on a pull request it is skipped.
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 20
    - name: Show the event
      run: |
        echo "event=${{ github.event_name }} ref=${{ github.ref }} sha=${{ github.sha }}"
        echo "base_sha=${{ github.event.merge_group.base_sha }}"
        echo "head_sha=${{ github.event.merge_group.head_sha }}"
        echo "head_ref=${{ github.event.merge_group.head_ref }}"
        git log --oneline --graph -n 8
    - name: Stand in for a long validation
      if: github.event_name == 'merge_group'
      run: sleep 45
    - name: Fail in the queue when the tree holds FAIL-IN-QUEUE
      if: github.event_name == 'merge_group'
      run: test ! -f FAIL-IN-QUEUE
